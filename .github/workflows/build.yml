name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk fuji-recipes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fuji-recipes-apk
          path: fuji-recipes.apk

      # Always keep one release called "latest" holding the newest APK, so there is a stable download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/fuji-recipes.apk
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest fuji-recipes.apk \
            --title "最新版 APK（build ${{ github.run_number }}）" \
            --notes "由 GitHub Actions 自動編譯。commit ${{ github.sha }}"
