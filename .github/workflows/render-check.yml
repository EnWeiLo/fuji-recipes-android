name: Render check

# Draws sample cards on an emulator and puts the pictures on the "render-check" branch so they can be looked at.
on:
  workflow_dispatch:
  push:
    branches: [polaroid-tab]
    paths:
      - "app/src/**"
      - "scripts/**"
      - ".github/workflows/render-check.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch fonts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv /tmp/fontenv
          /tmp/fontenv/bin/pip install --quiet fonttools
          /tmp/fontenv/bin/python scripts/fetch_polaroid_fonts.py 2>&1 | tee /tmp/fonts.txt || true
          ls -la app/src/main/assets/polaroid/fonts >> /tmp/fonts.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the render test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest 2>&1 | tee build.log
            mkdir -p render
            adb pull /sdcard/Pictures/rendercheck/. render/ || true

      - name: Publish pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          cp -r render/* /tmp/out/ 2>/dev/null || true
          cp /tmp/fonts.txt /tmp/out/fonts.txt || true
          { grep -E "^e: |FAILED|What went wrong|Caused by|BUILD |Tests |tests completed" build.log | head -60; tail -40 build.log; } > /tmp/out/log.txt 2>/dev/null || true
          cd /tmp/out
          git init -q -b render-check
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "render check ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" render-check || true
